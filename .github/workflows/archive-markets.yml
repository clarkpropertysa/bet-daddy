# Live orderbook capture. BEST EFFORT, and no longer the critical path.
#
# Candlesticks reconstruct price history retroactively at 1-minute granularity for
# ~22 days (see backfill-history.yml), so a missed tick here costs nothing
# recoverable. What this job uniquely captures is orderbook DEPTH, which
# candlesticks do not carry.
#
# GitHub's scheduler has been dropping the */15 schedule on this repo entirely
# (zero scheduled runs in 4+ hours while manual dispatch worked), so the cadence is
# offset off the round quarter-hour, where contention is worst.
name: archive-markets

on:
  schedule:
    - cron: "9,24,39,54 * * * *"
  workflow_dispatch:

concurrency:
  group: archive-markets
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - run: uv sync --all-extras

      - name: Snapshot open Kalshi prop markets
        env:
          KALSHI_API_BASE: ${{ vars.KALSHI_API_BASE || 'https://api.elections.kalshi.com/trade-api/v2' }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          # Durable home for the archive. Without this the only copy in CI is a
          # GitHub artifact that expires after 90 days -- mid-season.
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
        run: uv run python -m pipeline.ingest.kalshi_archiver --sports nfl,nba

      # Parquet first, DB second: a database outage must never cost us the data.
      - name: Upload snapshot artifact
        uses: actions/upload-artifact@v4
        with:
          name: market-snapshots-${{ github.run_id }}
          path: data/archive/market_snapshots/
          retention-days: 90
          if-no-files-found: error
