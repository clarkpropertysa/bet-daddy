# nflverse publishes on a weekly cadence during the season (pbp/snaps land Wed).
# Off-season this is mostly a no-op, which is fine — it is cheap and keeps the
# schema-drift check running so a breaking upstream change is caught before week 1.
name: ingest-nflverse

on:
  schedule:
    - cron: "41 11 * * *"   # 11:00 UTC daily
  workflow_dispatch:

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --all-extras

      - name: Ingest nflverse release parquet
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: uv run python -m pipeline.ingest.nflverse --seasons 2024,2025,2026

      # Fails the run on genuine schema drift, not on a season that has not started.
      - name: Sync reference, depth and schedule context into Neon
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          uv run python -m pipeline.ingest.sync_reference --season 2026
          uv run python -m pipeline.ingest.depth --season 2026
          uv run python -m pipeline.ingest.sync_context --season 2026 --ratings-pbp data/raw/nflverse/pbp_2025.parquet

      - name: Verify known-correct values
        run: uv run python -m pytest tests/ -q
