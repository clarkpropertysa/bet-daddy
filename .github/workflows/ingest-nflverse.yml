# nflverse publishes on a weekly cadence during the season (pbp/snaps land Wed).
# Off-season this is mostly a no-op, which is fine — it is cheap and keeps the
# schema-drift check running so a breaking upstream change is caught before week 1.
name: ingest-nflverse

on:
  schedule:
    - cron: "41 11 * * *"   # 11:00 UTC daily
  workflow_dispatch:

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --all-extras

      # Cached so a repeating job does not re-download 20MB of play-by-play every
      # run. Keyed on the ingest module so a schema change busts it.
      - name: Cache nflverse parquet
        uses: actions/cache@v4
        with:
          path: data/raw/nflverse
          # NOT keyed on run_id. That made the primary key miss every single time, so
          # every run restored the cache and then UPLOADED a fresh copy of the whole
          # parquet directory -- paying twice, on three workflows, for a cache that
          # never hit. Keyed on the ingest module, the cache saves once per change and
          # the ingest step below still fetches whatever is new.
          key: nflverse-${{ hashFiles('pipeline/ingest/nflverse.py') }}
          restore-keys: |
            nflverse-

      - name: Ingest nflverse release parquet
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          uv run python -m pipeline.ingest.nflverse --seasons 2024,2025,2026
          # See project-live.yml: these three are required downstream and are not in
          # the default dataset list.
          uv run python -m pipeline.ingest.nflverse \
            --datasets pbp,players,teams --seasons 2025,2026

      # Fails the run on genuine schema drift, not on a season that has not started.
      - name: Sync reference, depth and schedule context into Neon
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          uv run python -m pipeline.ingest.sync_reference --season 2026
          uv run python -m pipeline.ingest.depth --season 2026
          uv run python -m pipeline.ingest.sync_context --season 2026 --ratings-pbp data/raw/nflverse/pbp_2025.parquet
          # Player game logs and teammate splits. 2025 until week 1 produces 2026 data;
          # the 2026 call is a no-op that reports why rather than failing.
          uv run python -m pipeline.ingest.sync_player_stats --season 2025
          uv run python -m pipeline.ingest.sync_player_stats --season 2026 || true
          # This week's injury report, with the measured absence probability attached.
          # The week is derived from the schedule so it advances on its own; before the
          # season opens nflverse publishes nothing and the job writes zero rows.
          uv run python -m pipeline.ingest.sync_injuries --season 2026 || true

      # THE GRADER READS THE ARCHIVE, AND NOTHING EVER DOWNLOADED IT. blob.py could
      # only PUT, no workflow fetched the artifact, and the grade step below ended in
      # `|| true` -- so every CI grading run died on an empty glob
      # ("No files found that match the pattern data/archive/market_snapshots/**") and
      # reported success. Every graded row in the Track Record came from a laptop.
      - name: Fetch the market archive the grader reads
        env:
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: uv run python -m pipeline.ingest.fetch_archive

      # Settled mode only. This run exists to grow the CLV/calibration sample from
      # markets that have already resolved; it is deduplicated by market ticker, so
      # running it daily does not count one decision thirty times. The BOARD is fed
      # by the separate project-live workflow, which runs on the market's cadence
      # rather than nflverse's.
      - name: Extend the backtest sample on settled markets
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          uv run python -m pipeline.model.project \
            --mode settled \
            --depth data/raw/nflverse/depth_charts_2026.parquet || true

      # NOT `|| true`. The Track Record is the one number this project refuses to
      # soften, and a grader that fails silently leaves it frozen while looking fine.
      - name: Grade emitted signals on CLV and settlement
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: uv run python -m pipeline.backtest.grade

      - name: Verify known-correct values
        run: uv run python -m pytest tests/ -q
