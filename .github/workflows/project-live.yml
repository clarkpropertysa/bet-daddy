# Feeds the board. Separate from ingest-nflverse on purpose: nflverse publishes
# weekly, but a market price moves all day, and a board priced off a once-a-day
# quote is a board showing yesterday's market. This job takes its own fresh
# snapshot and reprices, so what the board shows is minutes old, not hours.
name: project-live

on:
  schedule:
    # Offset from the round hour: GitHub queues everyone's :00 crons together and
    # sheds the overflow. Note that on a private repo the scheduler throttles hard
    # regardless of what is written here -- archive-markets asks for every 15
    # minutes and actually fires roughly every 2-3 hours. Treat the cron as an
    # upper bound on frequency, never a guarantee, and read priceAsOf on the board
    # for what is actually true.
    # HOURLY ONLY WHEN GAMES ARE NEAR. An hourly run all week cost ~10 minutes a firing
    # for a board nobody was reading on a Tuesday. Kickoff windows (UTC): Sunday from
    # 16:00, Monday to 04:00 for the late games, Thursday/Friday evening for the opener.
    # EVERY TWO HOURS, not hourly, even on Sunday. Top Picks now leads with projections,
    # and a projection does not move between kickoffs -- only the price does, and the
    # price-led section is empty while the model has no earned weight.
    - cron: "7 16,18,20,22 * * 0"   # Sunday afternoon and evening games
    - cron: "7 0,2,4 * * 1,2"       # Sunday night and Monday night, in UTC
    - cron: "7 23 * * 4"            # Thursday night kickoff
    - cron: "7 1,3 * * 5"           # ...and its second half, in UTC
    - cron: "7 12 * * *"            # one heartbeat a day the rest of the week
  workflow_dispatch:

# Two repricing runs overlapping would race each other to the same tickers.
concurrency:
  group: project-live
  cancel-in-progress: false

jobs:
  project:
    runs-on: ubuntu-latest
    # 30, not 20: the prune now runs first, and a run that finds a large backlog
    # (a day of outage, or a week of Sundays) works through it market by market.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --all-extras

      # Cached so a repeating job does not re-download 20MB of play-by-play every
      # run. Keyed on the ingest module so a schema change busts it.
      - name: Cache nflverse parquet
        uses: actions/cache@v4
        with:
          path: data/raw/nflverse
          # NOT keyed on run_id. That made the primary key miss every single time, so
          # every run restored the cache and then UPLOADED a fresh copy of the whole
          # parquet directory -- paying twice, on three workflows, for a cache that
          # never hit. Keyed on the ingest module, the cache saves once per change and
          # the ingest step below still fetches whatever is new.
          key: nflverse-${{ hashFiles('pipeline/ingest/nflverse.py') }}
          restore-keys: |
            nflverse-

      - name: Fetch the parquet the projection reads
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          uv run python -m pipeline.ingest.nflverse --seasons 2025,2026
          # pbp, players and teams are NOT in the default dataset list, and every one
          # of them is required downstream: pbp drives team ratings and volume,
          # players is the ID crosswalk, teams carries branding. Without this line CI
          # ingested successfully and then failed to project, every time.
          uv run python -m pipeline.ingest.nflverse \
            --datasets pbp,players,teams --seasons 2025,2026

      # BEFORE the repricing, not after. Every run writes a full board with its
      # rationale and nothing reads a superseded one, so unpruned the table reached
      # 406 MB of Neon's 512 MB ceiling and the repricing began failing with
      # "DiskFull: could not extend file because project size limit (512 MB) has been
      # exceeded" -- the board stopped updating for a day. A prune that runs after the
      # write is a prune that never runs on a full database.
      #
      # Deliberately not `|| true`: a pruner failing quietly is a database filling up.
      - name: Make room -- prune superseded signals
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: uv run python -m pipeline.model.prune

      - name: Snapshot the market and reprice the board
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
        run: |
          uv run python -m pipeline.model.project \
            --mode live \
            --refresh \
            --depth data/raw/nflverse/depth_charts_2026.parquet

      # Reference only -- never produces a Signal. Answers D8's revisit trigger:
      # is this venue's pricing drifting from the wider market?
      - name: Compare game markets to the sportsbook consensus
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: uv run python -m pipeline.ingest.game_markets --season 2026 || true
