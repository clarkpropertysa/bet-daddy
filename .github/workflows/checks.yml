# Runs on every push. Cheap, and it guards the one thing that is now implemented
# twice: the edge formula exists in Python (authoritative, graded for CLV) and in
# TypeScript (repricing the board against a live quote). A fee rate corrected in one
# and not the other would put a number on screen that no grade will ever match.
name: checks

on:
  push:
    branches: [main]
    # A DECISIONS.md entry cannot break the edge formula, and this job fetches a
    # season of parquet to check that it has not. Documentation pushes are most of
    # the pushes on this repo.
    paths-ignore:
      - "**/*.md"
  pull_request:
    paths-ignore:
      - "**/*.md"
  workflow_dispatch:

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --all-extras

      # 40 tests assert against REAL nflverse data -- measured shrinkage constants,
      # target shares that must reconcile with official weekly stats. That is the
      # point of them: a fixture cannot catch upstream changing a column's meaning.
      # The data is gitignored, so it has to be fetched, and cached so pushes are cheap.
      - name: Cache nflverse parquet
        uses: actions/cache@v4
        with:
          path: data/raw/nflverse
          # NOT keyed on run_id. That made the primary key miss every single time, so
          # every run restored the cache and then UPLOADED a fresh copy of the whole
          # parquet directory -- paying twice, on three workflows, for a cache that
          # never hit. Keyed on the ingest module, the cache saves once per change and
          # the ingest step below still fetches whatever is new.
          key: nflverse-${{ hashFiles('pipeline/ingest/nflverse.py') }}
          restore-keys: |
            nflverse-

      - name: Fetch the parquet the tests assert against
        run: |
          uv run python -m pipeline.ingest.nflverse --seasons 2025,2026
          uv run python -m pipeline.ingest.nflverse \
            --datasets pbp,players,teams --seasons 2025,2026

      - name: Verify known-correct values
        run: uv run python -m pytest tests/ -q

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --prefix web
      - name: Edge maths matches the Python it was ported from
        run: npm run check:edge --prefix web
      - name: Parlay correlation checks
        run: npm run check:parlay --prefix web
      - name: Board game filter spans two identifier spaces
        run: npm run check:games --prefix web
      - name: Types
        run: npx --prefix web tsc --noEmit -p web/tsconfig.json
